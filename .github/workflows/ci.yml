name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node packages/cli/dist/bin.js bench
      - run: node packages/cli/dist/bin.js compare demo
      - run: node packages/cli/dist/bin.js retrieve --query TokenMeter --root packages/core
      - run: node bin/optima.js help
      - run: node packages/cli/dist/bin.js taxonomy | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); if(!j.techniques||j.techniques.length<10) process.exit(1);})"
      - name: Validate init in temp dir
        run: |
          TMP=$(mktemp -d)
          cd "$TMP"
          node "$GITHUB_WORKSPACE/bin/optima.js" init --host all
          node "$GITHUB_WORKSPACE/bin/optima.js" doctor
          node "$GITHUB_WORKSPACE/packages/cli/dist/bin.js" doctor
      - name: Pack smoke
        run: node scripts/pack-smoke.mjs
